<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskFlow</title>
<meta name="theme-color" content="#ffffff">
<script>
// Apply the saved theme before first paint so there's no light flash in dark mode.
(function(){try{var t=localStorage.getItem('taskflow.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f9a03f'/%3E%3Cstop offset='1' stop-color='%23f2635b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f7;--panel:#fff;--panel2:#fafafb;--line:#e8e8ed;--line2:#d9d9e0;--text:#1d1d23;--muted:#6b6b76;--faint:#9c9ca7;
  --chip:#f0f0f3;--hover:#f4f4f6;--overlay:rgba(20,20,30,.35);--inverse:#1d1d23;--inverse-ink:#fff;
  --accent:#f2635b;--accent-soft:#fdeeed;--accent-line:#f8cfcc;--accent-ink:#c2413a;--shadow:0 1px 2px rgba(16,16,24,.06);
  --p-low-bg:#eef2f7;--p-low:#5b6b82;--p-med-bg:#fff4d6;--p-med:#a16207;--p-high-bg:#ffedd5;--p-high:#c2410c;--p-crit-bg:#fee2e2;--p-crit:#b91c1c;
  --danger-bg:#fef2f2;--danger-line:#fecaca;--danger-ink:#dc2626;--info-bg:#eef4ff;--info-line:#d6e3ff;--info-ink:#1e4fb8;
}
/* Dark theme: chosen in the ⋯ menu, or following the device when set to System. */
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#111114;--panel:#1b1b20;--panel2:#202026;--line:#2c2c34;--line2:#3b3b45;--text:#ececf1;--muted:#a3a3ae;--faint:#777782;
  --chip:#2a2a31;--hover:#26262d;--overlay:rgba(0,0,0,.6);--inverse:#ececf1;--inverse-ink:#16161a;
  --accent-soft:rgba(242,99,91,.15);--accent-line:rgba(242,99,91,.4);--accent-ink:#ff8f88;--shadow:0 1px 2px rgba(0,0,0,.4);
  --p-low-bg:rgba(148,163,184,.16);--p-low:#b8c4d6;--p-med-bg:rgba(234,179,8,.16);--p-med:#facc15;--p-high-bg:rgba(249,115,22,.17);--p-high:#fdba74;--p-crit-bg:rgba(239,68,68,.18);--p-crit:#fca5a5;
  --danger-bg:rgba(239,68,68,.13);--danger-line:rgba(239,68,68,.38);--danger-ink:#f87171;--info-bg:rgba(59,130,246,.14);--info-line:rgba(59,130,246,.38);--info-ink:#9ab8ff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    color-scheme:dark;
    --bg:#111114;--panel:#1b1b20;--panel2:#202026;--line:#2c2c34;--line2:#3b3b45;--text:#ececf1;--muted:#a3a3ae;--faint:#777782;
    --chip:#2a2a31;--hover:#26262d;--overlay:rgba(0,0,0,.6);--inverse:#ececf1;--inverse-ink:#16161a;
    --accent-soft:rgba(242,99,91,.15);--accent-line:rgba(242,99,91,.4);--accent-ink:#ff8f88;--shadow:0 1px 2px rgba(0,0,0,.4);
    --p-low-bg:rgba(148,163,184,.16);--p-low:#b8c4d6;--p-med-bg:rgba(234,179,8,.16);--p-med:#facc15;--p-high-bg:rgba(249,115,22,.17);--p-high:#fdba74;--p-crit-bg:rgba(239,68,68,.18);--p-crit:#fca5a5;
    --danger-bg:rgba(239,68,68,.13);--danger-line:rgba(239,68,68,.38);--danger-ink:#f87171;--info-bg:rgba(59,130,246,.14);--info-line:rgba(59,130,246,.38);--info-ink:#9ab8ff;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.45 Lexend,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
svg{flex:none}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-right:6px}
.logo{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#f9a03f,#f2635b)}
.datenav{display:flex;align-items:center;gap:6px}
.datenav input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--panel)}
.daytitle{font-weight:600;font-size:15px}
.progress{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11px}
.progress .bar{width:90px;height:4px;background:var(--chip);border-radius:4px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tracked{font-size:12px;color:var(--muted)}
.tracked b{font-variant-numeric:tabular-nums;color:var(--text)}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95);background:var(--accent)}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:4px 9px;font-size:12px}
.icon-btn{width:28px;height:28px;padding:0;justify-content:center}

/* week strip */
.week{display:flex;gap:8px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;align-items:stretch}
.day{flex:1;min-width:96px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--panel);text-align:left}
.day:hover{border-color:var(--line2)}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.day .dl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.day .dl em{font-style:normal;color:var(--accent);font-weight:600}
.day .dn{font-size:16px;font-weight:600}
.day .ds{font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:6px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:2px;margin-right:8px}
.tab{border:none;background:none;padding:9px 10px;color:var(--muted);border-bottom:2px solid transparent;display:inline-flex;gap:6px;align-items:center}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--chip)}
.seg button{border:none;background:none;padding:4px 10px;border-radius:6px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.search{border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:190px;outline:none}
.search:focus{border-color:var(--line2)}

main{flex:1;overflow:auto;padding:16px 20px}

/* board */
.board{display:flex;gap:14px;align-items:flex-start;height:100%;min-width:min-content}
.col{flex:0 0 272px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:100%}
.col-h{display:flex;align-items:center;gap:8px;padding:11px 12px 11px 14px;border-bottom:1px solid var(--line);font-weight:600}
.col-h .btn{margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.count{background:var(--chip);border-radius:10px;padding:0 7px;font-size:11px;color:var(--muted);font-weight:500}
.col-body{padding:10px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:70px;transition:background .15s}
.col-body.over{background:var(--panel2)}
.empty{color:var(--faint);text-align:center;font-size:12px;padding:14px 4px}
.col-f{border-top:1px solid var(--line);padding:6px}
.add-link{width:100%;border:none;background:none;color:var(--muted);padding:6px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.add-link:hover{color:var(--accent);background:var(--panel2)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.card.dragging{opacity:.45}
.card-t{display:flex;gap:10px;padding:11px 10px 9px 12px;align-items:flex-start}
.card-t .title{flex:1;font-weight:500;word-break:break-word}
.card.done .title{text-decoration:line-through;color:var(--faint)}
.grip{color:var(--line2);cursor:grab;line-height:1;padding-top:2px}
.chk{width:15px;height:15px;margin:2px 0 0;accent-color:var(--accent);flex:none;cursor:pointer}
.card-desc{padding:0 12px 9px 37px;color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.card-b{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.pri::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.p-low{background:var(--p-low-bg);color:var(--p-low)}
.p-med{background:var(--p-med-bg);color:var(--p-med)}
.p-high{background:var(--p-high-bg);color:var(--p-high)}
.p-critical{background:var(--p-crit-bg);color:var(--p-crit)}
.pill.meta{background:var(--panel);border-color:var(--line);color:var(--muted)}
.pill.late{border-color:var(--danger-line);color:var(--danger-ink);background:var(--danger-bg)}
.timer{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 7px 1px 2px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--panel)}
.timer button{width:18px;height:18px;border-radius:50%;border:none;background:var(--chip);display:grid;place-items:center;padding:0;color:var(--muted)}
.timer button:hover{background:var(--accent);color:#fff}
.timer.on{border-color:var(--accent);color:var(--accent)}
.timer.on button{background:var(--accent);color:#fff}

.quick{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:8px;box-shadow:0 0 0 3px var(--accent-soft)}
.quick textarea{width:100%;border:none;outline:none;resize:none;min-height:44px}
.quick .hint{font-size:11px;color:var(--faint)}

/* list */
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:760px}
.list table{width:100%;border-collapse:collapse}
.list th{text-align:left;font-weight:500;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;border-bottom:1px solid var(--line)}
.list td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr.grp td{background:var(--panel2);font-weight:600;padding:9px 12px}
.list tr.row{cursor:pointer}
.list tr.row:hover td{background:var(--panel2)}
.list tr.row.done .ttl{text-decoration:line-through;color:var(--faint)}
.list .sub{color:var(--muted);font-size:12px;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list select{border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:var(--panel)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* report */
.report{display:flex;flex-direction:column;gap:16px;max-width:1100px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto}
.panel h3{margin:0;font-size:13px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel table{width:100%;border-collapse:collapse;min-width:700px}
.panel th,.panel td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right}
.panel th:first-child,.panel td:first-child{text-align:left}
.panel th{font-weight:500;color:var(--faint);font-size:11px}
.panel th.sel{color:var(--accent)}
.panel tfoot td{font-weight:600;background:var(--panel2)}
.panel td.zero{color:var(--line2)}
.sbars{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sbar{display:grid;grid-template-columns:100px 1fr 40px;align-items:center;gap:10px;font-size:12px}
.sbar .track{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.sbar .track i{display:block;height:100%;border-radius:4px}

/* modal */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay[hidden]{display:none}
.drawer{background:var(--panel);width:min(1140px,100%);height:min(840px,100%);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
.m-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.m-timer{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.m-timer b{font-family:ui-monospace,Consolas,monospace;color:var(--text);font-size:13px}
.m-body{flex:1;display:grid;grid-template-columns:1fr 350px;min-height:0}
.m-main{overflow:auto;padding:18px 24px 30px}
.m-side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.crumb{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.m-title{width:100%;border:none;resize:none;font-size:20px;font-weight:700;outline:none;padding:4px 0;overflow:hidden;line-height:1.3;border-radius:6px}
.m-title:hover{background:var(--panel2)}
.props{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;margin:12px 0 16px}
.prop{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line)}
.prop:nth-child(odd){border-right:1px solid var(--line)}
.prop:last-child{border-bottom:none}
.prop label{width:78px;color:var(--muted);font-size:12px;flex:none}
.prop select,.prop input{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel);outline:none;min-width:0}
.m-desc{width:100%;min-height:130px;border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical;outline:none}
.m-desc:focus,.m-title:focus{border-color:var(--line2)}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.sec-h .count{font-weight:500}
.sub-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.sub-row span{flex:1}
.sub-row.done span{text-decoration:line-through;color:var(--faint)}
.x{border:none;background:none;color:var(--faint);padding:2px;border-radius:4px;display:grid;place-items:center}
.x:hover{color:var(--danger-ink);background:var(--danger-bg)}
.inline-add{display:flex;gap:8px;flex-wrap:wrap}
.inline-add input{flex:1;min-width:120px;border:1px dashed var(--line2);border-radius:8px;padding:7px 10px;outline:none}
.inline-add input:focus{border-style:solid}
.entries{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.entry{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.entry:last-child{border-bottom:none}
.entry .d{font-variant-numeric:tabular-nums;font-weight:600;margin-left:auto;color:var(--text)}
.entry.live{color:var(--accent)}
.side-tabs{display:flex;gap:2px;padding:4px 12px 0;border-bottom:1px solid var(--line)}
.side-list{flex:1;overflow:auto;padding:12px 14px}
.remark{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px;word-break:break-word}
.remark .meta{font-size:11px;color:var(--faint);display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.hist{display:flex;gap:10px;font-size:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.hist time{color:var(--faint);white-space:nowrap;margin-left:auto;font-size:11px}
.composer{border-top:1px solid var(--line);padding:10px 12px}
.composer textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;resize:none;min-height:70px;outline:none}
.composer textarea:focus{border-color:var(--line2)}
.composer .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:var(--faint)}

/* running bar + toast */
.runbar{position:fixed;right:20px;bottom:20px;background:var(--inverse);color:var(--inverse-ink);border-radius:12px;padding:7px 8px 7px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:40;max-width:calc(100vw - 40px)}
.runbar .nm{cursor:pointer;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runbar b{font-family:ui-monospace,Consolas,monospace}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite;flex:none}
@keyframes pulse{50%{opacity:.3}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--inverse);color:var(--inverse-ink);padding:8px 14px;border-radius:8px;z-index:90;font-size:12px}

/* cloud: account, sharing, view-only */
.dd{position:relative}
.dd summary{list-style:none}
.dd summary::-webkit-details-marker{display:none}
.acct summary{display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.dd .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);min-width:240px;padding:6px;z-index:45}
.menu .lbl{font-size:11px;color:var(--faint);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.04em}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:8px;padding:8px 10px;border:none;background:none;border-radius:6px;text-align:left;color:var(--text);text-decoration:none}
.menu a:hover,.menu button:hover{background:var(--hover)}
.menu a.on{color:var(--accent);font-weight:500}
.menu hr{border:none;border-top:1px solid var(--line);margin:6px 0}
.ro-banner{display:flex;align-items:center;gap:8px;background:var(--info-bg);color:var(--info-ink);border:1px solid var(--info-line);border-radius:8px;padding:5px 10px;font-size:12px}
.sync{font-size:11px;color:var(--faint)}
.gate{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.gate[hidden]{display:none}
.gate-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;max-width:400px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.gate-box .logo{width:44px;height:44px;margin:0 auto 12px}
.gate-box h1{font-size:20px;margin:0 0 6px}
.gate-box p{color:var(--muted);margin:0 0 20px}
.gate-box .btn{justify-content:center;width:100%;padding:10px}
.gate-box small{display:block;color:var(--faint);margin-top:14px}
.share{background:var(--panel);width:min(480px,100%);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.22);padding:20px}
.share h2{margin:0 0 4px;font-size:17px}
.share p{color:var(--muted);margin:0 0 14px}
.share .row{display:flex;gap:8px;margin-bottom:12px}

/* ui polish */

/* features: undo toast, move sheet, timer check, summary, theme, repeat */
.toast{display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}

.grip{border:none;background:none;padding:2px 4px;margin:-2px -4px 0 0;border-radius:4px;font-size:13px}

.sheet-overlay{z-index:75}
.sheet{background:var(--panel);width:min(380px,100%);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:14px;max-height:100%;overflow:auto}
.sheet h3{margin:2px 4px 10px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ask .field{display:flex;flex-direction:column;gap:6px;margin:0 0 16px;font-size:12px;color:var(--muted)}
.ask .field input,.ask textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);outline:none}
.ask-btns{flex-wrap:wrap}
.summary{width:min(560px,100%);max-height:100%;overflow:auto}
.summary pre{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.55 Lexend,system-ui,sans-serif;margin:0 0 12px;max-height:46vh;overflow:auto}
.summary textarea{width:100%;min-height:56px;resize:vertical;margin-bottom:12px}
.seg.theme{display:flex;margin:2px 6px 8px}
.seg.theme button{flex:1;padding:5px 8px}
.prop.full{grid-column:1/-1;border-right:none}

@media (pointer:coarse){.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.grip{padding:6px 8px;margin:-6px -8px -4px 0}}

@media (max-width:820px){

}
@media (max-width:640px){

  .brand-name,.datenav input[type=date]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

  .toolbar{padding:4px 12px 8px;gap:6px}

  .add-btn{position:fixed;right:16px;bottom:16px;z-index:41;width:52px;height:52px;border-radius:50%;padding:0;justify-content:center;box-shadow:0 8px 24px rgba(242,99,91,.4)}
  .add-btn span{display:none}
  .add-btn svg{width:22px;height:22px}

  main{padding:12px;scroll-snap-type:x mandatory;scroll-padding:0 12px}
  .col{flex:0 0 86vw;max-width:none;scroll-snap-align:start}
  .runbar{left:12px;right:12px;bottom:12px;max-width:none}

  .overlay{padding:0}

}

</style>
</head>
<body>
<header class="top" id="top"></header>
<nav class="week" id="week"></nav>
<div class="toolbar" id="toolbar"></div>
<main id="view"></main>
<div id="runbar"></div>
<div class="overlay" id="overlay" hidden><div class="drawer" id="drawer" role="dialog" aria-modal="true"></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="gate" id="gate" hidden></div>
<div class="overlay" id="shareOverlay" hidden><div class="share" id="share" role="dialog" aria-modal="true"></div></div>

<script src="firebase-config.js"></script>
<script>
/* ---------- constants ---------- */
const STATUSES=[
  {id:'todo',name:'To-Do',color:'#3b82f6'},
  {id:'progress',name:'In Progress',color:'#f59e0b'},
  {id:'review',name:'In Review',color:'#8b5cf6'},
  {id:'done',name:'Done',color:'#22c55e'},
  {id:'blocked',name:'Blocked',color:'#ef4444'}
];
const PRI={low:'Low',med:'Medium',high:'High',critical:'Critical'};
const PRI_SHORT={low:'Low',med:'Med',high:'High',critical:'Critical'};
const KEY='taskflow.v1',UIKEY='taskflow.ui';

const svg=(d,s=14,fill=false)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" ${fill?'fill="currentColor"':'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'}>${d}</svg>`;
const I={
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  left:svg('<path d="m15 18-6-6 6-6"/>'),
  right:svg('<path d="m9 18 6-6-6-6"/>'),
  x:svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  xs:svg('<path d="M18 6 6 18M6 6l12 12"/>',12),
  trash:svg('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'),
  check:svg('<path d="M20 6 9 17l-5-5"/>'),
  clock:svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',12),
  cal:svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',12),
  chat:svg('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',12),
  list:svg('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
  board:svg('<rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/>'),
  chart:svg('<path d="M3 3v18h18M7 15v3M12 10v8M17 6v12"/>'),
  sub:svg('<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>',12),
  down:svg('<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>'),
  up:svg('<path d="M12 15V3m0 0L8 7m4-4 4 4M4 21h16"/>'),
  carry:svg('<path d="M5 12h14m0 0-5-5m5 5-5 5"/>'),
  play:svg('<path d="M7 4.5v15l13-7.5z"/>',9,true),
  stop:svg('<rect x="6" y="6" width="12" height="12" rx="2"/>',9,true),
  dots:svg('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',16,true),
  search:svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',13),
  doc:svg('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'),
  repeat:svg('<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',11),
};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseDay(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseDay(s);d.setDate(d.getDate()+n);return ymd(d)}
function weekStart(s){const d=parseDay(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
const today=()=>ymd(new Date());
const fmtLong=s=>parseDay(s).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'});
const fmtShort=s=>parseDay(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const fmtClock=ts=>new Date(ts).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
const fmtStamp=ts=>new Date(ts).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function fmtDur(ms){const t=Math.floor(ms/1000);return Math.floor(t/3600)+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60)}
function fmtHM(ms){const m=Math.round(ms/60000);if(!m)return ms>0?'<1m':'0m';const h=Math.floor(m/60);return((h?h+'h ':'')+(m%60?m%60+'m':'')).trim()}
function parseDur(s){
  s=s.trim().toLowerCase();if(!s)return NaN;let m;
  if(m=s.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/))return((+m[1])*3600+(+m[2])*60+(+(m[3]||0)))*1000;
  if(/^\d+(\.\d+)?$/.test(s))return parseFloat(s)*60000;
  let ms=0,ok=false;
  s.replace(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m|seconds?|secs?|s)\b/g,(_,n,u)=>{ok=true;n=parseFloat(n);ms+=u[0]==='h'?n*36e5:u[0]==='m'?n*6e4:n*1e3});
  return ok?ms:NaN;
}
// Toast with an optional action (e.g. Undo). onClose(actionTaken) runs when it disappears or is replaced.
function toast(msg,o={}){
  document.querySelectorAll('.toast').forEach(t=>t._close?.());
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML=`<span>${esc(msg)}</span>${o.action?`<button>${esc(o.action)}</button>`:''}`;
  let acted=false,closed=false;
  t._close=()=>{if(closed)return;closed=true;t.remove();o.onClose?.(acted)};
  if(o.action)t.querySelector('button').onclick=e=>{e.stopPropagation();acted=true;t._close();o.onAction?.()};
  document.body.appendChild(t);setTimeout(t._close,o.ms||2400);
}
// In-app dialog replacing confirm(). Resolves true/false, or the chosen value when `choices` are given
// (null on Esc / click outside). Extra form fields can go in `body`; read them from ask.lastEl afterwards.
function ask(msg,{title='Are you sure?',ok='Confirm',danger=false,choices=null,body='',cls=''}={}){
  return new Promise(res=>{
    const btns=choices||[{label:'Cancel',value:false},{label:ok,value:true,cls:'primary'+(danger?' danger':''),def:true}];
    const dflt=(btns.find(b=>b.def)||btns[btns.length-1]).value;
    const o=document.createElement('div');o.className='overlay ask-overlay';ask.lastEl=o;
    o.innerHTML=`<div class="ask ${cls}" role="alertdialog" aria-modal="true"><h2>${esc(title)}</h2>${msg?`<p>${esc(msg).replace(/\n/g,'<br>')}</p>`:''}${body}
      <div class="ask-btns">${btns.map((b,i)=>`<button class="btn ${b.cls||''}" data-r="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    const done=v=>{o.remove();document.removeEventListener('keydown',key,true);res(v)};
    const key=e=>{
      if(e.key==='Escape'){e.stopPropagation();e.preventDefault();done(choices?null:false)}
      else if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.stopPropagation();e.preventDefault();done(dflt)}
    };
    o.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-r]');if(b)done(btns[+b.dataset.r].value);else if(e.target===o)done(choices?null:false)});
    document.addEventListener('keydown',key,true);
    document.body.appendChild(o);
    o.querySelector(`[data-r="${btns.findIndex(b=>b.value===dflt)}"]`)?.focus();
  });
}

/* ---------- state ---------- */
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.tasks))return d}catch(e){}return{tasks:[]}}
// Cloud mode is on when firebase-config.js provides a config; cloud.js then owns loading and saving.
const CLOUD=!!window.FIREBASE_CONFIG;
let db=CLOUD?{tasks:[]}:load();
let ui={view:'board',scope:'day',sideTab:'remarks'};
try{Object.assign(ui,JSON.parse(localStorage.getItem(UIKEY))||{})}catch(e){}
Object.assign(ui,{date:today(),search:'',openId:null,quick:null,ro:false});

function save(){if(CLOUD){window.Cloud?.queue();return}try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save — storage is full or blocked')}}
function saveUi(){try{localStorage.setItem(UIKEY,JSON.stringify({view:ui.view,scope:ui.scope,sideTab:ui.sideTab}))}catch(e){}}
const byId=id=>db.tasks.find(t=>t.id===id);
const statusOf=id=>STATUSES.find(s=>s.id===id)||STATUSES[0];

/* ---------- task logic ---------- */
function log(t,text){t.activity.unshift({text,at:Date.now()})}
function newTask(o){
  const t={id:uid(),title:o.title,desc:'',status:o.status||'todo',priority:o.priority||'med',date:o.date||ui.date,due:'',
    subtasks:[],comments:[],activity:[],entries:[],running:null,order:Date.now()+Math.random(),createdAt:Date.now()};
  log(t,'Created this task');db.tasks.push(t);return t;
}
function setStatus(t,s){
  if(t.status===s)return;
  log(t,`Status: ${statusOf(t.status).name} → ${statusOf(s).name}`);
  t.status=s;
  if(s==='done'){stopTimer(t);t.completedAt=Date.now()}else t.completedAt=null;
}
function splitRange(start,end){
  const out={};let s=start;
  while(s<end){const d=new Date(s);const next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();const e=Math.min(end,next);const k=ymd(d);out[k]=(out[k]||0)+(e-s);s=e}
  return out;
}
function dayTime(t,day){
  let v=0;
  for(const e of t.entries){const ds=parseDay(day).getTime(),de=ds+864e5;v+=Math.max(0,Math.min(e.end,de)-Math.max(e.start,ds))}
  if(t.running)v+=splitRange(t.running,Date.now())[day]||0;
  return v;
}
function totalTime(t){let v=t.entries.reduce((a,e)=>a+(e.end-e.start),0);if(t.running)v+=Date.now()-t.running;return v}
const dayTotal=day=>db.tasks.reduce((a,t)=>a+dayTime(t,day),0);
function startTimer(t){
  db.tasks.forEach(x=>{if(x.running&&x!==t)stopTimer(x)});
  if(t.running)return;
  t.running=Date.now();log(t,'Started timer');
  if(t.status==='todo'||t.status==='blocked')setStatus(t,'progress');
}
function stopTimer(t){
  if(!t.running)return;
  const end=Date.now(),dur=end-t.running;
  if(dur>=1000)t.entries.push({id:uid(),start:t.running,end});
  t.running=null;log(t,'Stopped timer · tracked '+fmtHM(dur));
}
const running=()=>db.tasks.find(t=>t.running);
function stopTimerAt(t,end){
  if(!t.running)return;
  end=Math.max(t.running,Math.min(end,Date.now()));
  if(end-t.running>=1000)t.entries.push({id:uid(),start:t.running,end});
  log(t,`Stopped timer at ${fmtClock(end)} · tracked ${fmtHM(end-t.running)}`);
  t.running=null;
}

/* ---------- repeating tasks ----------
   Each occurrence is an ordinary task; occurrences of one series share `seriesId` and carry the rule
   (`repeat`, `anchor` date, `skips`). Today's occurrence is created from the latest one when the app
   opens, with a fixed id so two devices never create it twice. */
const REPEAT={daily:'Every day',weekdays:'Every weekday (Mon–Fri)',weekly:'Every week',monthly:'Every month'};
function repeatsOn(rule,anchor,day){
  const d=parseDay(day),a=parseDay(anchor);
  if(rule==='daily')return true;
  if(rule==='weekdays')return d.getDay()>0&&d.getDay()<6;
  if(rule==='weekly')return d.getDay()===a.getDay();
  if(rule==='monthly'){const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(a.getDate(),last)}
  return false;
}
const seriesOf=t=>t.seriesId?db.tasks.filter(x=>x.seriesId===t.seriesId):[t];
function setRepeat(t,rule){
  if(rule){
    t.seriesId=t.seriesId||t.id;
    seriesOf(t).forEach(x=>{x.repeat=rule;x.anchor=t.date;x.skips=x.skips||[]});
    log(t,'Repeats: '+REPEAT[rule].toLowerCase());
  }else{
    seriesOf(t).forEach(x=>x.repeat=null);
    log(t,'Stopped repeating');
  }
}
function ensureRecurring(){
  if(ui.ro)return false;
  const day=today(),latest=new Map();
  for(const t of db.tasks)if(t.seriesId&&t.repeat){const l=latest.get(t.seriesId);if(!l||t.date>l.date)latest.set(t.seriesId,t)}
  let made=false;
  latest.forEach((tpl,sid)=>{
    const id=sid+'_'+day;
    if(day<=tpl.date||byId(id)||(tpl.skips||[]).includes(day)||!repeatsOn(tpl.repeat,tpl.anchor||tpl.date,day))return;
    const t={id,title:tpl.title,desc:tpl.desc,status:'todo',priority:tpl.priority,date:day,due:'',
      subtasks:tpl.subtasks.map(s=>({id:uid(),text:s.text,done:false})),comments:[],activity:[],entries:[],running:null,
      order:tpl.order,createdAt:Date.now(),repeat:tpl.repeat,seriesId:sid,anchor:tpl.anchor||tpl.date,skips:tpl.skips||[]};
    log(t,'Added automatically · '+REPEAT[tpl.repeat].toLowerCase());
    db.tasks.push(t);made=true;
  });
  return made;
}

/* ---------- delete with undo ---------- */
async function deleteTask(t){
  if(t.repeat){
    const c=await ask('This task repeats. What would you like to delete?',{title:'Delete repeating task',choices:[
      {label:'Cancel',value:null},{label:'Stop repeating & delete',value:'stop',cls:'danger-text'},{label:'Only this day',value:'one',cls:'primary',def:true}]});
    if(!c)return;
    if(c==='one')seriesOf(t).forEach(x=>{x.skips=[...new Set([...(x.skips||[]),t.date])]});
    else setRepeat(t,null);
  }
  stopTimer(t);
  const i=db.tasks.indexOf(t);if(i<0)return;
  db.tasks.splice(i,1);
  if(ui.openId===t.id){ui.openId=null;$('#overlay').hidden=true;$('#drawer').innerHTML=''}
  commit();
  toast(`Deleted “${t.title}”`,{action:'Undo',ms:7000,
    onAction:()=>{db.tasks.push(t);log(t,'Restored after delete');commit();toast('Task restored')},
    // Remarks are only removed once the undo window has passed, so Undo brings them back too.
    onClose:undone=>{if(!undone&&CLOUD)Cloud.deleteTaskRemarks(t.id)}});
}

function openMoveSheet(id){

  const td=today(),tm=addDays(td,1);
  const dayBtn=(d,label)=>`<button data-mv="day" data-v="${d}" class="${t.date===d?'on':''}">${I.cal}${label}</button>`;
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Move task"><h3>${esc(t.title)}</h3>
    <div class="lbl">Move to</div>
    <div class="sheet-opts">${STATUSES.map(s=>`<button data-mv="status" data-v="${s.id}" class="${t.status===s.id?'on':''}"><span class="dot" style="background:${s.color}"></span>${s.name}</button>`).join('')}</div>
    <div class="lbl">Day</div>
    <div class="sheet-opts">${dayBtn(td,'Today')}${dayBtn(tm,'Tomorrow')}<input type="date" data-mv="pick" value="${t.date}" aria-label="Another day"></div>
    <div class="lbl">Position</div>
    <div class="sheet-opts"><button data-mv="top">${I.up}Top of column</button><button data-mv="bottom">${I.down}Bottom of column</button></div>
    <button class="btn cancel" data-mv="close">Cancel</button></div>`;
  const close=()=>{o.remove();document.removeEventListener('keydown',key,true)};
  const key=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};
  const moveDay=d=>{if(!d||d===t.date)return close();log(t,`Moved from ${fmtShort(t.date)} to ${fmtShort(d)}`);t.date=d;close();commit();toast('Moved to '+(d===td?'today':d===tm?'tomorrow':fmtShort(d)))};
  o.addEventListener('click',e=>{
    e.stopPropagation();
    const b=e.target.closest('button[data-mv]');
    if(!b){if(e.target===o)close();return}
    const k=b.dataset.mv,col=db.tasks.filter(x=>x.status===t.status&&x.date===t.date&&x!==t).map(x=>x.order);
    if(k==='status'){setStatus(t,b.dataset.v);close();commit();toast('Moved to '+statusOf(b.dataset.v).name)}
    else if(k==='day')moveDay(b.dataset.v);
    else if(k==='top'){t.order=Math.min(0,...col)-1;close();commit()}
    else if(k==='bottom'){t.order=Math.max(0,...col)+1;close();commit()}
    else close();
  });
  o.querySelector('[data-mv="pick"]').addEventListener('change',e=>moveDay(e.target.value));
  document.addEventListener('keydown',key,true);
  document.body.appendChild(o);
}

let lp=null,swallowClick=false;
document.addEventListener('pointerdown',e=>{

['pointermove','pointerup','pointercancel'].forEach(t=>document.addEventListener(t,cancelLp,{passive:true}));

/* ---------- forgotten-timer check ---------- */
const LONG_RUN=3*36e5,SNOOZE=36e5,SNOOZE_KEY='taskflow.snooze';
let timerAsking=false;
async function checkLongTimer(){
  const t=running();
  if(!t||ui.ro||timerAsking||document.querySelector('.ask-overlay'))return;
  let snooze={};try{snooze=JSON.parse(localStorage.getItem(SNOOZE_KEY))||{}}catch(e){}
  const key=t.id+':'+t.running;
  if(Date.now()<(snooze[key]||t.running+LONG_RUN))return;
  timerAsking=true;
  const local=ts=>{const d=new Date(ts);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
  const c=await ask(`The timer for “${t.title}” has been running for ${fmtHM(Date.now()-t.running)}, since ${fmtStamp(t.running)}.`,{
    title:'Still working on this?',
    body:`<label class="field">Forgot to stop it? When did you actually stop?<input type="datetime-local" id="stoppedAt" min="${local(t.running)}" max="${local(Date.now())}" value="${local(Date.now())}"></label>`,
    choices:[{label:'Stop at that time',value:'at'},{label:'Stop now',value:'now'},{label:'Keep going',value:'keep',cls:'primary',def:true}]});
  timerAsking=false;
  if(!byId(t.id)||!t.running)return;
  if(c==='now'){stopTimer(t);commit();toast('Timer stopped')}
  else if(c==='at'){
    const v=ask.lastEl.querySelector('#stoppedAt').value,end=v?new Date(v).getTime():NaN;
    if(!(end>t.running)){toast('Pick a time after the timer started');return}
    stopTimerAt(t,end);commit();toast('Timer stopped at '+fmtClock(end));
  }else{
    snooze[key]=Date.now()+SNOOZE;
    for(const k in snooze)if(!k.startsWith(t.id+':'))delete snooze[k];
    try{localStorage.setItem(SNOOZE_KEY,JSON.stringify(snooze))}catch(e){}
  }
}
setInterval(checkLongTimer,20000);
setTimeout(checkLongTimer,1500);

/* ---------- daily summary ---------- */
function summaryText(day,note){
  const who=ui.ro?(window.Cloud?.ownerName||''):(window.Cloud?.user?.displayName||'');
  const list=db.tasks.filter(t=>t.date===day||dayTime(t,day)>0).sort((a,b)=>a.order-b.order);
  const time=t=>{const v=dayTime(t,day);return v>=60000?` — ${fmtHM(v)}`:''};
  const lastRemark=t=>t.comments.length?t.comments[t.comments.length-1].text.split('\n')[0]:'';
  const groups=[
    ['✅ Done',list.filter(t=>t.status==='done')],
    ['🔄 In progress',list.filter(t=>t.status==='progress'||t.status==='review')],
    ['⛔ Blocked',list.filter(t=>t.status==='blocked')],
    ['📝 Still to do',list.filter(t=>t.status==='todo')],
  ];
  let s=`Daily update${who?' · '+who:''}\n${fmtLong(day)}\n\n⏱ Time tracked: ${fmtHM(dayTotal(day))}\n📊 ${groups[0][1].length} of ${list.length} task${list.length===1?'':'s'} done\n`;
  for(const[h,ts]of groups){
    if(!ts.length)continue;
    s+=`\n${h} (${ts.length})\n`;
    for(const t of ts){
      s+=`• ${t.title}${t.status==='review'?' (in review)':''}${time(t)}\n`;
      if(t.status==='blocked'&&lastRemark(t))s+=`   ↳ ${lastRemark(t)}\n`;
    }
  }
  if(!list.length)s+='\nNo tasks on this day.\n';
  if(note.trim())s+=`\n🗒 Notes\n${note.trim()}\n`;
  return s.trim();
}
function openSummary(){
  const day=ui.date,o=document.createElement('div');o.className='overlay ask-overlay';
  const to=!ui.ro&&window.Cloud?.viewers?.length?Cloud.viewers.join(','):'';
  o.innerHTML=`<div class="ask summary" role="dialog" aria-modal="true"><h2>Daily summary</h2>
    <p>${esc(fmtLong(day))} — copy it or send it to ${to?esc(to):'your manager'}.</p>
    <textarea id="sumNote" placeholder="Add a note (optional), e.g. plan for tomorrow"></textarea>
    <pre id="sumText"></pre>
    <div class="ask-btns"><button class="btn" data-s="close">Close</button><button class="btn" data-s="wa">WhatsApp</button><button class="btn" data-s="email">Email</button><button class="btn primary" data-s="copy">Copy</button></div></div>`;
  const text=()=>summaryText(day,o.querySelector('#sumNote').value);
  const show=()=>{o.querySelector('#sumText').textContent=text()};
  const close=()=>{o.remove();document.removeEventListener('keydown',key,true)};
  const key=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};
  o.addEventListener('input',show);
  o.addEventListener('click',e=>{
    e.stopPropagation();
    if(e.target===o)return close();
    const k=e.target.closest('[data-s]')?.dataset.s;
    if(k==='close')close();
    else if(k==='copy')(navigator.clipboard?.writeText(text())||Promise.reject()).then(()=>toast('Summary copied'),()=>{
      const r=document.createRange();r.selectNodeContents(o.querySelector('#sumText'));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');toast('Summary copied')});
    else if(k==='email')location.href=`mailto:${to}?subject=${encodeURIComponent('Daily update – '+fmtLong(day))}&body=${encodeURIComponent(text())}`;
    else if(k==='wa')window.open('https://wa.me/?text='+encodeURIComponent(text()),'_blank','noopener');
  });
  document.addEventListener('keydown',key,true);
  document.body.appendChild(o);show();
}

        ${days.map(d=>{const v=dayTime(t,d);return `<td class="num ${v||t.running?'':'zero'}">${T(t.id,'day:'+d)}</td>`}).join('')}
        <td class="num"><b>${T(t.id,'week:'+ws)}</b></td></tr>`).join(''):`<tr><td colspan="9" class="empty" style="text-align:center;padding:24px">No time tracked this week yet. Press ▶ on any task to start tracking.</td></tr>`}</tbody>
      <tfoot><tr><td>Total</td>${days.map(d=>`<td class="num" data-dt="${d}"></td>`).join('')}<td class="num" data-wt="${ws}"></td></tr></tfoot></table></div>
    <div class="panel"><h3>Status on ${fmtLong(ui.date)}</h3><div class="sbars">
      ${STATUSES.map(s=>{const n=dayTasks.filter(t=>t.status===s.id).length;return `<div class="sbar"><span>${s.name}</span><div class="track"><i style="width:${n/maxS*100}%;background:${s.color}"></i></div><span class="num">${n}</span></div>`}).join('')}
    </div></div>
  </div>`;
}
function renderView(){
  const tasks=visibleTasks();
  $('#view').innerHTML=ui.view==='list'?listHTML(tasks):ui.view==='report'?reportHTML():boardHTML(tasks);
  tick();
}
function renderRunbar(){
  const t=running();
  $('#runbar').innerHTML=t?`<div class="runbar"><span class="pulse"></span><span class="nm" data-act="open" data-id="${t.id}" title="Open task">${esc(t.title)}</span><b>${T(t.id,'total')}</b>
    ${ui.ro?'':`<button class="btn sm primary" data-act="timer" data-id="${t.id}">${I.stop} Stop</button>`}</div>`:'';
  document.body.classList.toggle('running',!!t);
  tick();
}

/* ---------- modal ---------- */
function modalHTML(t){
  const subDone=t.subtasks.filter(s=>s.done).length;
  const entries=[...t.entries].sort((a,b)=>b.start-a.start);
  const ro=ui.ro,dis=ro?'disabled':'';
  return `<div class="m-head">
      ${ro?`<span class="ro-banner">👁 View only — you can add remarks</span>`:`<button class="btn ${t.status==='done'?'':'primary'}" data-act="mComplete">${I.check}${t.status==='done'?'Completed — reopen':'Mark Complete'}</button>`}
      <div class="m-timer">${I.clock}<span class="hide-sm"> This day / Total</span> <b>${T(t.id,'day:'+ui.date)}</b> / <b>${T(t.id,'total')}</b>
        ${ro?(t.running?'<span class="pulse" title="Timer running"></span>':''):`<button class="btn sm ${t.running?'':'primary'}" data-act="timer" data-id="${t.id}">${t.running?I.stop+' Stop':I.play+' Start'}</button>`}</div>
      <div class="spacer"></div>
      ${ro?'':`<button class="btn icon-btn" data-act="mDelete" title="Delete task">${I.trash}</button>`}
      <button class="btn icon-btn" data-act="mClose" title="Close (Esc)">${I.x}</button>
    </div>
    <div class="m-body">
      <div class="m-main">
        <div class="crumb"><span class="pill meta">${I.cal}${fmtLong(t.date)}</span><span class="pill meta"><span class="dot" style="background:${statusOf(t.status).color}"></span>${statusOf(t.status).name}</span></div>
        <textarea class="m-title" data-field="title" rows="1" aria-label="Title" ${ro?'readonly':''}>${esc(t.title)}</textarea>
        <div class="props">
          <div class="prop"><label>Status</label><select data-field="status" ${dis}>${STATUSES.map(s=>`<option value="${s.id}" ${s.id===t.status?'selected':''}>${s.name}</option>`).join('')}</select></div>
          <div class="prop"><label>Priority</label><select data-field="priority" ${dis}>${Object.keys(PRI).map(p=>`<option value="${p}" ${p===t.priority?'selected':''}>${PRI[p]}</option>`).join('')}</select></div>
          <div class="prop"><label>Day</label><input type="date" data-field="date" value="${t.date}" title="Which day this task is planned for" ${dis}></div>
          <div class="prop"><label>Due date</label><input type="date" data-field="due" value="${t.due}" ${dis}></div>
          <div class="prop full"><label>Repeat</label><select data-field="repeat" ${dis}><option value="">Doesn't repeat</option>${Object.keys(REPEAT).map(k=>`<option value="${k}" ${t.repeat===k?'selected':''}>${REPEAT[k]}</option>`).join('')}</select>
            ${t.repeat?`<span class="hint-sm">A new copy appears on each matching day</span>`:''}</div>
        </div>
        <textarea class="m-desc" data-field="desc" placeholder="${ro?'No description':'Add a description…'}" ${ro?'readonly':''}>${esc(t.desc)}</textarea>

        <div class="sec"><div class="sec-h">${I.sub} Subtasks <span class="count">${subDone} / ${t.subtasks.length}</span></div>
          ${t.subtasks.map(s=>`<div class="sub-row ${s.done?'done':''}"><input type="checkbox" class="chk" data-chg="sub" data-sid="${s.id}" ${s.done?'checked':''} ${dis}><span>${esc(s.text)}</span>${ro?'':`<button class="x" data-act="delSub" data-sid="${s.id}" title="Remove">${I.xs}</button>`}</div>`).join('')}
          ${ro?(t.subtasks.length?'':'<div class="empty" style="text-align:left;padding:4px 0">No subtasks</div>'):'<div class="inline-add"><input id="subInput" placeholder="Add a subtask and press Enter"></div>'}
        </div>

        <div class="sec"><div class="sec-h">${I.clock} Time entries <span class="count">${fmtHM(totalTime(t))} total</span></div>
          ${entries.length||t.running?`<div class="entries">
            ${t.running?`<div class="entry live"><span class="pulse"></span>Running since ${fmtClock(t.running)} · ${fmtShort(ymd(new Date(t.running)))}<span class="d">${T(t.id,'live')}</span></div>`:''}
            ${entries.map(e=>`<div class="entry">${fmtShort(ymd(new Date(e.start)))} · ${e.manual?'Added manually':fmtClock(e.start)+' – '+fmtClock(e.end)}<span class="d">${fmtDur(e.end-e.start)}</span>${ro?'':`<button class="x" data-act="delEntry" data-eid="${e.id}" title="Delete entry">${I.xs}</button>`}</div>`).join('')}
          </div>`:''}
          ${ro?'':`<div class="inline-add"><input id="entryDur" placeholder="Add time manually, e.g. 1h 30m or 45"><input type="date" id="entryDay" value="${ui.date}" style="flex:0 0 150px"><button class="btn" data-act="addEntry">${I.plus}Add time</button></div>`}
        </div>
        <div class="sec" style="color:var(--faint);font-size:11px">Created ${fmtStamp(t.createdAt)}</div>
      </div>
      <aside class="m-side">
        <div class="side-tabs" id="sideTabs"></div>
        <div class="side-list" id="sideList"></div>
        <div class="composer"><textarea id="remarkInput" placeholder="Write a remark… (Enter to send, Shift+Enter for new line)"></textarea>
          <div class="row"><span>Remarks are timestamped notes on this task</span><button class="btn sm primary" data-act="sendRemark">Add remark</button></div></div>
      </aside>
    </div>`;
}
function renderSide(){
  const t=byId(ui.openId);if(!t)return;
  $('#sideTabs').innerHTML=`<button class="tab ${ui.sideTab==='remarks'?'on':''}" data-act="sideTab" data-v="remarks">${I.chat} Remarks (${t.comments.length})</button><button class="tab ${ui.sideTab==='history'?'on':''}" data-act="sideTab" data-v="history">History</button>`;
  $('#sideList').innerHTML=ui.sideTab==='remarks'
    ?(t.comments.length?[...t.comments].reverse().map(c=>{
        const mine=!c.authorUid||c.authorUid===window.Cloud?.user?.uid;
        return `<div class="remark"><div class="meta"><span>${c.authorName?`<b style="color:var(--muted)">${esc(mine?'You':c.authorName)}</b> · `:''}${fmtStamp(c.at)}</span>${!ui.ro||mine?`<button class="x" data-act="delRemark" data-cid="${c.id}" title="Delete remark">${I.xs}</button>`:''}</div>${esc(c.text).replace(/\n/g,'<br>')}</div>`}).join(''):'<div class="empty">No remarks yet.</div>')
    :t.activity.map(a=>`<div class="hist"><span>${esc(a.text)}</span><time>${fmtStamp(a.at)}</time></div>`).join('');
}
function renderModal(){
  const t=byId(ui.openId);
  if(!t){closeModal();return}
  const keep={remark:$('#remarkInput')?.value,sub:$('#subInput')?.value,dur:$('#entryDur')?.value};
  const scroll=$('.m-main')?.scrollTop;
  $('#drawer').innerHTML=modalHTML(t);
  $('#overlay').hidden=false;
  if(keep.remark)$('#remarkInput').value=keep.remark;
  if(keep.sub)$('#subInput').value=keep.sub;
  if(keep.dur)$('#entryDur').value=keep.dur;
  if(scroll)$('.m-main').scrollTop=scroll;
  autosize($('.m-title'));autosize($('.m-desc'));renderSide();tick();
}
function autosize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
function openTask(id){ui.openId=id;ui.quick=null;renderModal()}
function closeModal(){ui.openId=null;$('#overlay').hidden=true;$('#drawer').innerHTML='';render()}

function render(){if(ensureRecurring())save();renderTop();renderWeek();renderToolbar();renderView();renderRunbar();if(ui.openId)renderModal()}
function commit(){save();render()}

/* ---------- live timer ticking ---------- */
function tick(){
  const cache={};
  document.querySelectorAll('[data-tt]').forEach(el=>{
    const t=byId(el.dataset.tt);if(!t)return;const k=el.dataset.tk;let v;
    if(k==='total')v=totalTime(t);
    else if(k==='live')v=t.running?Date.now()-t.running:0;
    else if(k.startsWith('day:'))v=dayTime(t,k.slice(4));
    else if(k.startsWith('week:')){const ws=k.slice(5);v=0;for(let i=0;i<7;i++)v+=dayTime(t,addDays(ws,i))}
    el.textContent=(k.startsWith('day:')&&!v)?'—':fmtDur(v);
  });
  document.querySelectorAll('[data-dt]').forEach(el=>{
    const d=el.dataset.dt,v=cache[d]??(cache[d]=dayTotal(d));
    el.textContent=el.dataset.short?(v?fmtHM(v):''):fmtDur(v);
  });
  document.querySelectorAll('[data-wt]').forEach(el=>{let v=0;for(let i=0;i<7;i++)v+=dayTotal(addDays(el.dataset.wt,i));el.textContent=fmtHM(v)});
  const r=running();document.title=r?`▶ ${fmtDur(totalTime(r))} · ${r.title}`:'TaskFlow';
}
// Live clocks only change while a timer runs; renders call tick() themselves.
setInterval(()=>{if(!document.hidden&&running())tick()},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- actions ---------- */
function submitQuick(keepOpen){
  const el=$('#quickInput');if(!el)return;
  const lines=el.value.split('\n').map(s=>s.trim()).filter(Boolean);
  lines.forEach(title=>newTask({title,status:ui.quick}));
  if(!keepOpen||!lines.length)ui.quick=null;
  commit();
  if(ui.quick)focusQuick();
}
function focusQuick(){const q=$('#quickInput');if(q){q.focus();q.scrollIntoView({block:'nearest'})}}
function addSub(){const el=$('#subInput'),t=byId(ui.openId);const v=el.value.trim();if(!v)return;t.subtasks.push({id:uid(),text:v,done:false});log(t,'Added subtask “'+v+'”');el.value='';commit();$('#subInput').focus()}
function sendRemark(){
  const el=$('#remarkInput'),t=byId(ui.openId);const v=el.value.trim();if(!v)return;
  if(CLOUD){
    // Remarks live in their own collection so a view-only manager can add them too.
    if(!ui.ro)log(t,'Added a remark');
    el.value='';ui.sideTab='remarks';
    Cloud.addRemark(t.id,v).catch(()=>{toast('Could not add the remark');el.value=v});
    if(!ui.ro)commit();else renderSide();
    $('#remarkInput')?.focus();return;
  }
  t.comments.push({id:uid(),text:v,at:Date.now()});log(t,'Added a remark');el.value='';ui.sideTab='remarks';commit();$('#remarkInput').focus()
}
// Actions a view-only viewer may still use.
const RO_OK=new Set(['shift','today','pick','pickDate','clearSearch','view','scope','open','export','mClose','sendRemark','delRemark','sideTab','summary','theme']);

const A={
  shift:a=>{ui.date=addDays(ui.date,+a.dataset.n);render()},
  today:()=>{ui.date=today();render()},
  pick:a=>{ui.date=a.dataset.day;render()},
  pickDate:()=>{const p=$('#datePick');try{p.showPicker()}catch(e){p.focus()}},
  clearSearch:()=>{ui.search='';renderToolbar();renderView();$('#search').focus()},
  view:a=>{ui.view=a.dataset.v;saveUi();render()},
  scope:a=>{ui.scope=a.dataset.v;saveUi();render()},
  quickAdd:a=>{ui.view='board';ui.quick=a.dataset.status||'todo';render();focusQuick()},
  open:(a,e)=>{e.preventDefault();openTask(a.dataset.id)},
  toggleDone:a=>{const t=byId(a.dataset.id);setStatus(t,t.status==='done'?'todo':'done');commit()},
  timer:a=>{const t=byId(a.dataset.id);t.running?stopTimer(t):startTimer(t);commit()},
  carry:async()=>{const list=carryable();if(!await ask(`Move ${list.length} unfinished task(s) from earlier days to ${fmtLong(ui.date)}?`,{title:'Carry over tasks',ok:'Move tasks'}))return;
    list.forEach(t=>{log(t,`Carried over from ${fmtShort(t.date)} to ${fmtShort(ui.date)}`);t.date=ui.date});commit();toast(`Carried over ${list.length} task(s)`)},
  export:()=>{const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`taskflow-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
  import:()=>$('#importFile').click(),
  mClose:()=>closeModal(),
  mComplete:()=>{const t=byId(ui.openId);setStatus(t,t.status==='done'?'todo':'done');commit()},
  mDelete:()=>deleteTask(byId(ui.openId)),
  delSub:a=>{const t=byId(ui.openId),i=t.subtasks.findIndex(s=>s.id===a.dataset.sid);if(i<0)return;const[s]=t.subtasks.splice(i,1);commit();
    toast('Subtask removed',{action:'Undo',ms:5000,onAction:()=>{t.subtasks.splice(i,0,s);commit()}})},
  delEntry:a=>{const t=byId(ui.openId);const e=t.entries.find(x=>x.id===a.dataset.eid);if(!e)return;
    t.entries=t.entries.filter(x=>x!==e);log(t,'Removed time entry of '+fmtHM(e.end-e.start));commit();
    toast(`Removed ${fmtHM(e.end-e.start)} time entry`,{action:'Undo',ms:6000,onAction:()=>{t.entries.push(e);log(t,'Restored time entry of '+fmtHM(e.end-e.start));commit()}})},
  moveMenu:a=>openMoveSheet(a.dataset.id),
  summary:()=>openSummary(),
  theme:a=>setTheme(a.dataset.v),
  addEntry:()=>{const t=byId(ui.openId);const ms=parseDur($('#entryDur').value);const day=$('#entryDay').value||ui.date;
    if(!(ms>0)){toast('Enter a duration like 1h 30m, 45m or 1:15');return}
    if(ms>864e5){toast('Max 24h per entry');return}
    const start=parseDay(day).getTime();t.entries.push({id:uid(),start,end:start+ms,manual:true});log(t,`Added ${fmtHM(ms)} manually for ${fmtShort(day)}`);$('#entryDur').value='';commit()},
  sendRemark:()=>sendRemark(),
  delRemark:async a=>{const t=byId(ui.openId);if(!await ask('This remark will be removed for everyone who can see this task.',{title:'Delete remark?',ok:'Delete',danger:true}))return;
    if(CLOUD){Cloud.delRemark(a.dataset.cid).catch(()=>toast('Could not delete the remark'));return}
    t.comments=t.comments.filter(c=>c.id!==a.dataset.cid);commit()},
  sideTab:a=>{ui.sideTab=a.dataset.v;saveUi();renderSide()},
};

document.addEventListener('click',e=>{
  document.querySelectorAll('details.dd[open]').forEach(d=>{if(!d.contains(e.target)||e.target.closest('.menu [data-act]'))d.open=false});
  if(ui.quick&&!e.target.closest('.quick')&&!e.target.closest('[data-act="quickAdd"]')){
    if($('#quickInput')?.value.trim())submitQuick(false);else{ui.quick=null;renderView()}
  }
  const a=e.target.closest('[data-act]');
  if(!a)return;
  const act=a.dataset.act,fn=A[act]||window.Cloud?.actions?.[act];
  if(!fn)return;
  if(a.closest('.card,.row'))e.stopPropagation();
  if(ui.ro&&A[act]&&!RO_OK.has(act)){e.preventDefault();toast('View only — you can add remarks');return}
  fn(a,e);
});
$('#overlay').addEventListener('mousedown',e=>{if(e.target.id==='overlay')closeModal()});

document.addEventListener('input',e=>{
  const el=e.target,f=el.dataset.field;
  if(el.id==='search'){ui.search=el.value;renderView();return}
  if(el.id==='quickInput'){autosize(el);return}
  if(ui.ro)return;
  if((f==='title'||f==='desc')&&ui.openId){const t=byId(ui.openId);t[f]=el.value;autosize(el);save();renderView();renderRunbar()}
});
document.addEventListener('change',e=>{
  const el=e.target,f=el.dataset.field;
  if(el.id==='datePick'){if(el.value){ui.date=el.value;render()}return}
  if(el.id==='importFile'){importFile(el.files[0]);el.value='';return}
  if(ui.ro)return;
  if(el.dataset.chg==='status'){setStatus(byId(el.dataset.id),el.value);commit();return}
  if(el.dataset.chg==='sub'){const t=byId(ui.openId),s=t.subtasks.find(x=>x.id===el.dataset.sid);s.done=el.checked;log(t,`${s.done?'Completed':'Reopened'} subtask “${s.text}”`);commit();return}
  if(!f||!ui.openId)return;
  const t=byId(ui.openId);
  if(f==='title'){if(!el.value.trim()){el.value=t.title='Untitled task'}log(t,'Renamed to “'+t.title.trim()+'”');save();renderView();renderSide();return}
  if(f==='desc'){log(t,'Updated description');save();renderSide();return}
  if(f==='status')setStatus(t,el.value);
  if(f==='priority'){log(t,`Priority: ${PRI[t.priority]} → ${PRI[el.value]}`);t.priority=el.value}
  if(f==='date'){if(!el.value){el.value=t.date;return}log(t,`Moved from ${fmtShort(t.date)} to ${fmtShort(el.value)}`);t.date=el.value}
  if(f==='due'){log(t,el.value?'Due date set to '+fmtShort(el.value):'Removed due date');t.due=el.value}
  if(f==='repeat')setRepeat(t,el.value||null);
  commit();
});
document.addEventListener('keydown',e=>{
  const id=e.target.id;
  if(id==='quickInput'){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitQuick(true)}else if(e.key==='Escape'){ui.quick=null;renderView()}return}
  if(id==='subInput'&&e.key==='Enter'){e.preventDefault();addSub();return}
  if(id==='entryDur'&&e.key==='Enter'){e.preventDefault();A.addEntry();return}
  if(id==='remarkInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendRemark();return}
  if(e.target.dataset.field==='title'&&e.key==='Enter'){e.preventDefault();e.target.blur();return}
  if(id==='search'&&e.key==='Escape'){if(ui.search)A.clearSearch();else e.target.blur();return}
  if(e.key==='Escape'&&!$('#shareOverlay')?.hidden)return;
  if(e.key==='Escape'&&ui.openId){closeModal();return}
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if(!typing&&!ui.openId&&e.key==='/'&&$('#search')){e.preventDefault();$('#search').focus();return}
  if(!typing&&!ui.openId&&!ui.ro&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==='n'||e.key==='N')){e.preventDefault();A.quickAdd({dataset:{status:'todo'}})}
});

/* drag & drop between columns */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.card');if(!c||ui.ro)return;dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging').forEach(c=>c.classList.remove('dragging'));document.querySelectorAll('.over').forEach(c=>c.classList.remove('over'));dragId=null});
document.addEventListener('dragover',e=>{
  const z=e.target.closest?.('[data-drop]');if(!z||!dragId)return;e.preventDefault();
  document.querySelectorAll('.over').forEach(c=>c!==z&&c.classList.remove('over'));z.classList.add('over');
  const card=document.querySelector('.card.dragging');if(!card)return;
  const after=[...z.querySelectorAll('.card:not(.dragging)')].find(c=>{const r=c.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  if(after)z.insertBefore(card,after);else{const tail=z.querySelector('.empty,.quick');tail?z.insertBefore(card,tail):z.appendChild(card)}
});
document.addEventListener('drop',e=>{
  const z=e.target.closest?.('[data-drop]');if(!z||!dragId)return;e.preventDefault();
  const t=byId(dragId);
  [...z.querySelectorAll('.card')].forEach((c,i)=>{const x=byId(c.dataset.id);if(x)x.order=i});
  setStatus(t,z.dataset.drop);commit();
});

function importFile(file){
  if(!file)return;
  file.text().then(async txt=>{
    const d=JSON.parse(txt);
    if(!d||!Array.isArray(d.tasks))throw new Error('bad');
    if(!await ask(`Replace your current ${db.tasks.length} task(s) with the ${d.tasks.length} task(s) in this backup?`,{title:'Restore backup?',ok:'Replace tasks',danger:true}))return;
    d.tasks.forEach(t=>{t.subtasks??=[];t.comments??=[];t.activity??=[];t.entries??=[];t.desc??='';t.due??='';t.priority??='med';t.status??='todo'});
    ui.openId=null;$('#overlay').hidden=true;
    if(CLOUD){Cloud.importTasks(d.tasks).then(()=>toast('Backup restored'),()=>toast('Could not restore the backup'));return}
    db=d;commit();toast('Backup restored');
  }).catch(()=>toast('That file is not a TaskFlow backup'));
}

if(CLOUD){$('#gate').hidden=false;$('#gate').innerHTML='<div class="gate-box"><div class="logo"></div><h1>TaskFlow</h1><p>Loading…</p></div>'}
render();
</script>
<script type="module" src="cloud.js"></script>
